{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Verify OTP</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>

<div class="page">

  <!-- Card -->
  <div class="card">
    <div class="card-head">
      <div class="card-logo">so<span>cial</span></div>
      <p class="card-sub">Verification code sent to your email! ✨</p>
    </div>

    {% if e_msg %}
      <div class="alert alert-danger" role="alert">
        {{e_msg}}
      </div>
    {% endif %}

    <form class="form" action="{% url 'verify_otp' %}" method="post">
      {% csrf_token %}
      
      <!-- Hidden Email -->
      <input type="hidden" name="email" value="{{email}}">

      <!-- OTP Field -->
      <div class="field">
        <label class="label">Verification Code</label>
        <div class="input-wrap">
          <i class="fa-solid fa-key inp-icon"></i>
          <input type="text" class="input" placeholder="Enter 4-digit OTP" name="otp" required maxlength="6">
        </div>
      </div>
      
      <input type="submit" class="btn" value="verify-otp" id="button">
        <!-- <i class="fa-solid fa-check-circle"></i> -->
      <!-- </button> -->

    </form>

    <p class="switch">toggle password
      <a href="{% url 'login' %}" style="text-decoration: none;">Move to login →</a>
    </p>

      <p class="switch" id="context_value"> 
          Otp timer <span id="timer"  style="text-decoration: none;"> 30 second</span>
      </p>

    <p class="switch" id="resendbtnmain" style="display: none;"> 
       <span id="resendbtn"> resend OTP</span>
    </p>

      

  </div>

</div>
 

<script>
  // Fetch dynamic badge counts
  document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/unread-counts/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(res => res.json())
      .then(data => {
        const msgBadge = document.getElementById('msg-badge');
        const notifBadge = document.getElementById('notif-badge');
        
        if (msgBadge) {
          if (data.messages > 0) {
            msgBadge.textContent = data.messages;
            msgBadge.style.display = 'flex';
          } else {
            msgBadge.style.display = 'none';
          }
        }
        
        if (notifBadge) {
          if (data.notifications > 0) {
            notifBadge.textContent = data.notifications;
            notifBadge.style.display = 'flex';
          } else {
            notifBadge.style.display = 'none';
          }
        }
      })
      .catch(err => console.error('Error fetching badge counts:', err));
  });
</script>
</body>


  <script>


    console.log("scripting called ");

    let timer_value = document.getElementById("timer");
    let context_value = document.getElementById("context_value");
    let button = document.getElementById("button");
    let resendbtnmain = document.getElementById("resendbtnmain")
    let resendbtn = document.getElementById("resendbtn")
 
    console.log(timer_value);
    console.log(timer_value.innerHTML);
    console.log(timer_value.button); 

    let time = 30;
    let timer_interval = null;
    let trial = 1    // 1 sec = 1000

    function repeattimer(){

          timer_interval = setInterval(() => {
            if(time <= 0)
            {
                console.log("timer expired");
                context_value.innerHTML = "Timert Expired !!!"
                button.style.backgroundColor = "Caramel Brown"
                button.disabled = true;
                button.style.opacity = 0.4;
                if (trial == 1)
                {
                    resendbtnmain.style.display = "block"; 

                }

                console.log(button);
                trial = 2;
            }
            else
            {
                time--;
                timer_value.innerHTML = time;
            }
        }, 1000);
    }

    repeattimer();

    resendbtn.addEventListener("click", () => {
        time = 30;
        button.disabled = false;
        button.style.opacity = 1;
        context_value.innerHTML = 'Otp timer <span id="timer" >' + time + '</span> sec';
        timer_value = document.getElementById("timer");
        resendbtnmain.style.display = "none";
        repeattimer();

    });
    

</script>

</html>
