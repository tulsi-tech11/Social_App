{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>social — Create Reel</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/userpanel.css' %}">
  <link rel="stylesheet" href="{% static 'css/create.css' %}">
</head>

<body>

  <!-- ══ LEFT SIDEBAR ══════════════════════════════ -->
  <nav class="sidebar">
    <div class="logo">so<span>cial</span></div>
    <div class="nav-links">
      <a href="{% url 'home' %}" class="nav-item"><span class="nav-icon"><i class="fa-solid fa-house"></i></span><span
          class="nav-label">Home</span></a>
      <a href="{% url 'search' %}" class="nav-item"><span class="nav-icon"><i
            class="fa-solid fa-magnifying-glass"></i></span><span class="nav-label">Search</span></a>
      <a href="{% url 'reels' %}" class="nav-item"><span class="nav-icon"><i class="fa-regular fa-square-caret-right"></i></span><span
          class="nav-label">Reels</span></a>
      <a href="{% url 'messages' %}" class="nav-item has-badge"><span class="nav-icon"><i
            class="fa-solid fa-paper-plane"></i></span><span class="nav-label">Messages</span><span class="badge" id="msg-badge" style="display:none;"></span></a>
      <a href="{% url 'notification' %}" class="nav-item has-badge"><span class="nav-icon"><i
            class="fa-solid fa-bell"></i></span><span class="nav-label">Notifications</span><span class="badge red" id="notif-badge" style="display:none;"></span></a>
      <div class="nav-item-wrapper">
        <a href="javascript:void(0)" class="nav-item"
          onclick="var m=document.getElementById('create-submenu');m.style.display=m.style.display==='flex'?'none':'flex';"><span
            class="nav-icon"><i class="fa-regular fa-square-plus"></i></span><span class="nav-label">Create</span></a>
        <div id="create-submenu" class="create-submenu" style="display:none;">
          <a href="{% url 'create' %}" class="create-submenu-option"><span class="nav-icon"><i
                class="fa-regular fa-image"></i></span><span class="nav-label">Create Post</span></a>
          <a href="{% url 'create_reel' %}" class="create-submenu-option"><span class="nav-icon"><i
                class="fa-regular fa-square-caret-right"></i></span><span class="nav-label">Create Reel</span></a>
        </div>
      </div>
      <a href="{% url 'profile' %}" class="sidebar-profile-mini">
        <span class="nav-icon">
          <img src="{{uid.profile_pic.url}}" alt="Profile">
        </span>
        <span class="nav-label">Profile</span>
      </a>
    </div>
    <div class="sidebar-divider"></div>
    <div class="nav-bottom">
      <a href="{% url 'settings' %}" class="nav-item"><span class="nav-icon"><i
            class="fa-solid fa-gear"></i></span><span class="nav-label">Settings</span></a>
      <a href="{% url 'logout' %}" class="nav-item logout-btn"><span class="nav-icon"><i
            class="fa-solid fa-right-from-bracket"></i></span><span class="nav-label">Logout</span></a>
    </div>
  </nav>

  <!-- ══ ALL PAGES ══════════════════════════════════ -->
  <div class="pages-wrapper">

    <!-- ── CREATE REEL ─────────────────────────────────── -->
    <div id="create-reel" class="page page-full" style="display:block;">
      <div class="page-content narrow">
        <div class="page-header"><i class="fa-regular fa-square-caret-right"></i> Create Reel</div>
        <form method="post" enctype="multipart/form-data" action="{% url 'create_reel' %}">
          {% csrf_token %}
          <div class="create-box">
            <div class="create-upload-zone">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <div class="upload-text">Drag & drop your video here</div>
              <div class="upload-sub">or</div>
              <label class="upload-btn">Browse Files<input type="file" style="display:none" accept="video/*"
                  name="video" required></label>
              <div class="upload-formats">MP4, MOV, WEBM · Max 50MB</div>
            </div>

            <div class="create-form">
              <div class="form-group"><label class="form-label">Caption</label><textarea class="form-textarea"
                  placeholder="Write a caption for your reel…" rows="4" name="caption"></textarea></div>

              <div class="form-group"><label class="form-label">Tag User</label>
                <div class="form-input-icon"><i class="fa-solid fa-at"></i><input type="text" class="form-input"
                    placeholder="Enter username to tag" name="tagged_user"></div>
              </div>
              
              <div class="form-group"><label class="form-label">Location</label>
                <div class="form-input-icon"><i class="fa-solid fa-location-dot"></i><input type="text"
                    class="form-input" placeholder="Add location" name="location"></div>
              </div>
              <div class="create-actions"><a href="{% url 'home' %}" class="cancel-btn">Discard</a><button type="submit"
                  class="publish-btn"><i class="fa-solid fa-paper-plane"></i> Share Reel</button></div>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div><!-- /pages-wrapper -->

<script>
  // Fetch dynamic badge counts
  document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/unread-counts/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(res => res.json())
      .then(data => {
        const msgBadge = document.getElementById('msg-badge');
        const notifBadge = document.getElementById('notif-badge');
        
        if (msgBadge) {
          if (data.messages > 0) {
            msgBadge.textContent = data.messages;
            msgBadge.style.display = 'flex';
          } else {
            msgBadge.style.display = 'none';
          }
        }
        
        if (notifBadge) {
          if (data.notifications > 0) {
            notifBadge.textContent = data.notifications;
            notifBadge.style.display = 'flex';
          } else {
            notifBadge.style.display = 'none';
          }
        }
      })
      .catch(err => console.error('Error fetching badge counts:', err));
  });
</script>
</body>


</html>
