{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Log In</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/login.css' %}?v=1.1">
</head>
<body>

<div class="page">

  <!-- Logo -->
  

  <!-- Card -->
  <div class="card">
    <div class="card-logo"><center>so<span>cial</span></center></div>
    <div class="card-head">   
    </div>

    {% if e_msg %}
      <div class="alert alert-danger" role="alert">
        {{e_msg}}
      </div>
    {% endif %}

    {% if s_msg %}
      <div class="alert alert-success" role="alert">
        {{s_msg}}
      </div>
    {% endif %}

    <form class="form" action="{% url 'login' %}" method="post">
      {% csrf_token %}
      <div class="field">
        <label class="label">Email</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope inp-icon"></i>
          <input type="text" class="input" placeholder="Enter Your Email" autocomplete="username" name="email">
        </div>
      </div>

      <div class="field">
        <div class="label-row">
          <label class="label">Password</label>
        </div>
        <div class="input-wrap">
          <i class="fa-solid fa-lock inp-icon"></i>
          <input type="password" class="input" placeholder="Enter your password" id="pw" autocomplete="current-password" name="password">
          <button type="button" class="eye" onclick="toggle('pw',this)"><i class="fa-regular fa-eye"></i></button>
        </div>
      </div>

      <label class="check-row">
        <input type="checkbox" class="check-inp">
        <span class="check-box"></span>
        <span class="check-lbl">Keep me logged in</span>
      </label>

      <button type="submit" class="btn">
        <i class="fa-solid fa-right-to-bracket"></i> Log In
      </button>

    </form>


    <p class="switch">Don't have an account? 
      <a href="{% url 'register' %}" style="text-decoration: none;">Sign up →</a><br>
      <a href="{% url 'forgot_password' %}" class="forgot">Forgot password?</a>
    </p>
    

  </div>

</div>

<script>
  function toggle(id, btn) {
    const inp = document.getElementById(id);
    const ic = btn.querySelector('i');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    ic.className = inp.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
  }
</script>

<script>
  // Fetch dynamic badge counts
  document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/unread-counts/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(res => res.json())
      .then(data => {
        const msgBadge = document.getElementById('msg-badge');
        const notifBadge = document.getElementById('notif-badge');
        
        if (msgBadge) {
          if (data.messages > 0) {
            msgBadge.textContent = data.messages;
            msgBadge.style.display = 'flex';
          } else {
            msgBadge.style.display = 'none';
          }
        }
        
        if (notifBadge) {
          if (data.notifications > 0) {
            notifBadge.textContent = data.notifications;
            notifBadge.style.display = 'flex';
          } else {
            notifBadge.style.display = 'none';
          }
        }
      })
      .catch(err => console.error('Error fetching badge counts:', err));
  });
</script>
</body>

</html>
