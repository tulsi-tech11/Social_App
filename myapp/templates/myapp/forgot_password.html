{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social — Forgot Password</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
<link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>

<div class="page">

  <!-- Card -->
  <div class="card">
    <div class="card-head">
      <div class="card-logo">so<span>cial</span></div>
      <p class="card-sub">Forgot your password? No worries! ✨</p>
    </div>

    {% if e_msg %}
      <div class="alert alert-danger" role="alert">
        {{e_msg}}
      </div>
    {% endif %}

    {% if s_msg %}
      <div class="alert alert-success" role="alert">
        {{s_msg}}
      </div>
    {% endif %}

    <form class="form" action="{% url 'forgot_password' %}" method="post">
      {% csrf_token %}
      
      <!-- Email Field -->
      <div class="field">
        <label class="label">Email Address</label>
        <div class="input-wrap">
          <i class="fa-solid fa-envelope inp-icon"></i>
          <input type="email" class="input" placeholder="Enter Your Email" name="email" required>
        </div>
      </div>
      
      <button type="submit" class="btn">
        <i class="fa-regular fa-paper-plane"></i> Send OTP
      </button>

    </form>

    <p class="switch">Remembered your password? 
      <a href="{% url 'login' %}" style="text-decoration: none;">Log In →</a>
    </p>

  </div>

</div>


<script>
  // Fetch dynamic badge counts
  document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/unread-counts/', { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(res => res.json())
      .then(data => {
        const msgBadge = document.getElementById('msg-badge');
        const notifBadge = document.getElementById('notif-badge');
        
        if (msgBadge) {
          if (data.messages > 0) {
            msgBadge.textContent = data.messages;
            msgBadge.style.display = 'flex';
          } else {
            msgBadge.style.display = 'none';
          }
        }
        
        if (notifBadge) {
          if (data.notifications > 0) {
            notifBadge.textContent = data.notifications;
            notifBadge.style.display = 'flex';
          } else {
            notifBadge.style.display = 'none';
          }
        }
      })
      .catch(err => console.error('Error fetching badge counts:', err));
  });
</script>
</body>

</html>
